[project]
name = "ramen-mcp-bridge"
version = "0.2.3"
description = "Stdio MCP bridge for Project Ramen: forwards JSON-RPC to a ramen.v1.Mcp/Call worker over gRPC"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = [
    "grpcio>=1.76",
    "grpcio-health-checking>=1.76",
    "protobuf>=5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16", "grpcio-tools>=1.76", "mcp>=2,<3"]

[project.urls]
Homepage = "https://github.com/bkraad47/ramen-mcp-bridge"
Ramen = "https://github.com/bkraad47/ramen"

[project.scripts]
ramen-mcp-bridge = "ramen_mcp_bridge.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramen_mcp_bridge", "src/ramen_proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["src/ramen_proto/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/ramen_proto"]
